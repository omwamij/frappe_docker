name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Superseded PR validation may stop; main/release runs retain unique groups.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate CI safety contracts
        run: python3 -m unittest discover -s .github/tests -p "test_*.py"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.6"

      # For shfmt pre-commit hook
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "^1.14"

      - name: Install pre-commit
        run: pip install -U pre-commit

      - name: Lint
        run: pre-commit run --color=always --all-files
        env:
          GO111MODULE: on
